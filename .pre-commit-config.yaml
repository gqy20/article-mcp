# Pre-commit钩子配置 - 纯 Ruff 方案
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-docstring-first

  # Ruff: 替代 black + isort + flake8 的超快 Python linter 和 formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      # Ruff linter - 代码质量检查 + 自动修复
      - id: ruff
        args: [--fix, --show-fixes]
        # markdown 一并纳入：ruff 0.17 起会格式化 Markdown 里的 Python 代码块，
        # CI 的 `ruff format --check .` 同样会检查 .md，两边保持一致
        types_or: [python, pyi, jupyter, markdown]
      # Ruff formatter - 替代 black (快 100 倍)
      - id: ruff-format
        types_or: [python, pyi, jupyter, markdown]

  - repo: local
    hooks:
      - id: mypy-check
        name: mypy-check
        # 用项目自身的环境跑（uv run），保证 fastmcp / aiohttp 等依赖的类型信息可用
        entry: uv run mypy src
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest-check
        name: pytest-check
        entry: uv run pytest tests/unit/test_six_tools.py::TestSixToolIntegration::test_all_tools_registered -q
        language: system
        pass_filenames: false
        always_run: false

# 配置选项
default_stages: [pre-commit]
fail_fast: false
