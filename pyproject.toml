[project]
name = "article-mcp"
version = "0.2.3"
description = "Article MCP文献搜索服务器 - 基于Europe PMC、arXiv等多个数据源的学术文献搜索工具"
authors = [
    {name = "gqy20", email = "qingyu_ge@foxmail.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["mcp", "literature", "search", "europe-pmc", "arxiv", "academic"]
dependencies = [
    "fastmcp>=4.2.4",
    "requests>=2.34.2",
    "python-dateutil>=4.0.0",
    "urllib3>=2.8.0",
    "aiohttp>=3.14.5",
    "markdownify>=1.2.4",
    "filelock>=4.2.12",
]

[project.urls]
Homepage = "https://github.com/gqy20/article-mcp"
Repository = "https://github.com/gqy20/article-mcp"
Issues = "https://github.com/gqy20/article-mcp/issues"

[project.scripts]
article-mcp = "article_mcp.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    # Ruff: 替代 black + isort + flake8
    "ruff>=0.17.6",
    # 类型检查
    "mypy>=2.4.1",
    "types-requests>=2.33.0.20261030",
    # Pre-commit hooks
    "pre-commit>=4.7.0",
    "psutil>=7.2.2"
]

[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

# Ruff: 替代 black + isort + flake8
[tool.ruff]
target-version = "py311"
line-length = 100

# Ruff 格式化配置 (替代 black)
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Ruff Lint 配置 (替代 flake8 + isort)
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import 排序)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    # "D",   # pydocstyle (禁用：中文文档不适用)
]
ignore = [
    "E501",   # line too long (ruff-format 会处理)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "B904",   # raise ... from err (中间件异常处理不适用)
    "N806",   # 变量名小写 (中文变量名不适用)
]

# Import 排序配置 (替代 isort)
[tool.ruff.lint.isort]
known-first-party = ["article_mcp", "tests"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused-import
"tests/**/*.py" = ["E402", "F841", "F401", "B904", "E722"]  # 测试文件允许非顶部导入、未使用变量、裸except
"scripts/**/*.py" = ["E402", "F841", "F401", "B904"]  # 脚本文件允许非顶部导入、未使用变量
"src/article_mcp/services/api_utils.py" = ["E402"]  # 延迟导入 aiohttp

# mypy per-file ignores (通过 comments 实现，见各文件)

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/.*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["article_mcp*"]

[dependency-groups]
dev = [
    "psutil>=7.1.2",
]
